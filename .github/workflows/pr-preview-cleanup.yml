name: PR Preview Cleanup

on:
  pull_request_target:
    types: [closed]

# Write permissions are safe here — this workflow runs from the base repository
# context and never checks out fork code (it only deletes a directory by PR number).
permissions:
  contents: write
  pull-requests: write

# Use the same concurrency group as the deploy workflow so cleanup and
# deploy pushes to gh-pages are always serialized.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  cleanup:
    name: Remove Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Switch to gh-pages branch
        id: ghpages
        run: |
          git fetch origin gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -B gh-pages origin/gh-pages
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No gh-pages branch found, nothing to clean up."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete preview directory
        if: steps.ghpages.outputs.exists == 'true'
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          PREVIEW_DIR="pr-previews/${PR_NUMBER}"
          if [ -d "${PREVIEW_DIR}" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm -rf "${PREVIEW_DIR}"
            git commit -m "chore: remove preview for PR #${PR_NUMBER}"
            for attempt in 1 2 3; do
              git fetch origin gh-pages
              if git rebase origin/gh-pages; then
                git push origin gh-pages && break
              else
                git rebase --abort
              fi
              echo "Push attempt ${attempt} failed, retrying..."
              sleep $((attempt * 5))
            done
          else
            echo "No preview directory found for PR #${PR_NUMBER}, nothing to do."
          fi

      - name: Update preview comment to reflect closure
        if: steps.ghpages.outputs.exists == 'true'
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = process.env.PR_NUMBER;
            const owner    = context.repo.owner;
            const repo     = context.repo.repo;

            const marker = '<!-- pr-preview-bot -->';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo,
                comment_id: existing.id,
                body: marker + '\n## 📄 Documentation Preview\n\n> This preview has been removed because the PR was closed.',
              });
            }
