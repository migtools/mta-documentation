name: PR Preview Deploy

on:
  workflow_run:
    workflows: ["PR Preview"]
    types: [completed]

# This workflow runs from the base repository context (main branch).
permissions:
  contents: write
  pages: write
  pull-requests: write

# Serialize all gh-pages pushes to prevent non-fast-forward failures
# when two PRs deploy at the same time.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-preview-site
          path: /tmp/pr-preview-site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      
      - name: Extract preview artifact
        run: |
          ARTIFACT_TAR="/tmp/pr-preview-site/pr-preview-site.tar.gz"
          if [ -f "$ARTIFACT_TAR" ]; then
            tar -xzf "$ARTIFACT_TAR" -C /tmp/pr-preview-site
          else
            echo "Artifact tarball not found; listing /tmp/pr-preview-site:"
            ls -la /tmp/pr-preview-site || true
            exit 1
          fi

      - name: Read PR number from artifact
        id: pr
        run: |
          # prefer the pr-number file inside _site, fall back to root
          PR_FILE="/tmp/pr-preview-site/_site/pr-number.txt"
          if [ ! -f "$PR_FILE" ]; then
            PR_FILE="/tmp/pr-preview-site/pr-number.txt"
          fi

          if [ -f "$PR_FILE" ]; then
            PR_NUMBER=$(cat "$PR_FILE")
            echo "number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
            rm -f "$PR_FILE"
          else
            echo "PR number file not found, checked /tmp/pr-preview-site/_site/pr-number.txt and /tmp/pr-preview-site/pr-number.txt"
            echo "::error::PR number file is required for preview deployment"
            exit 1
          fi

      - name: Get PR head SHA
        id: sha
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              pull_number: ${{ steps.pr.outputs.number }},
            });
            core.setOutput('sha', pr.data.head.sha.substring(0, 7));

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Prepare Pages publish directory (merge with existing gh-pages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.pr.outputs.number }}"
          PUBLISH_DIR="/tmp/publish"

          rm -rf "$PUBLISH_DIR"
          mkdir -p "$PUBLISH_DIR"

          # If gh-pages exists on the remote, clone it into a temp dir and copy its contents
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "Cloning existing gh-pages branch into /tmp/gh-pages"
            git clone --depth 1 --branch gh-pages "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" /tmp/gh-pages || true
            # Copy existing pages content into publish dir (preserve existing previews)
            cp -a /tmp/gh-pages/. "$PUBLISH_DIR/" || true
          else
            echo "No gh-pages branch found; creating new site skeleton"
            echo "GitHub Pages for ${GITHUB_REPOSITORY}" > "$PUBLISH_DIR/README.md"
            touch "$PUBLISH_DIR/.nojekyll"
          fi

          # Place the new preview under pr-previews/<PR_NUMBER>
          PREVIEW_DIR="$PUBLISH_DIR/pr-previews/${PR_NUMBER}"
          rm -rf "$PREVIEW_DIR"
          mkdir -p "$PREVIEW_DIR"

          # Copy the extracted _site contents into the preview directory
          if [ -d "/tmp/pr-preview-site/_site" ]; then
            cp -a /tmp/pr-preview-site/_site/. "$PREVIEW_DIR/"
          else
            # fallback: copy whole artifact dir if _site is not present
            cp -a /tmp/pr-preview-site/. "$PREVIEW_DIR/"
          fi

          # Ensure .nojekyll exists so Pages doesn't ignore files
          touch "$PUBLISH_DIR/.nojekyll"

          echo "Prepared publish directory contents:"
          ls -la "$PUBLISH_DIR" || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: /tmp/publish

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1

      - name: Post or update preview comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const sha      = '${{ steps.sha.outputs.sha }}';
            const owner    = context.repo.owner;
            const repo     = context.repo.repo;

            const previewUrl =
              `https://${owner}.github.io/${repo}/pr-previews/${prNumber}/`;

            const body = [
              `## 📄 Documentation Preview`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **Preview URL** | ${previewUrl} |`,
              `| **Commit** | \`${sha}\` |`,
              `| **Updated** | ${new Date().toUTCString()} |`,
              ``,
              `> Preview updates automatically on every push to this PR.`,
              `> It will be removed when the PR is closed.`,
            ].join('\n');

            const marker = '<!-- pr-preview-bot -->';
            const markedBody = marker + '\n' + body;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo,
                comment_id: existing.id,
                body: markedBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: prNumber,
                body: markedBody,
              });
            }