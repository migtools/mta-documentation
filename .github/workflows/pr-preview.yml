name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'assemblies/**'
      - 'topics/**'
      - '_includes/**'
      - '_layouts/**'
      - '_sass/**'
      - 'assets/**'
      - '_config.yml'
      - 'Gemfile'
      - 'index.md'
      - '.github/workflows/pr-preview.yml'

# Needed so the deploy job can push to gh-pages and post comments
permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-deploy:
    name: Build & Deploy Preview
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          # Full history lets Jekyll see git metadata (last-modified dates etc.)
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true   # caches gems between runs automatically

      - name: Install system dependencies
        run: sudo apt-get install -y asciidoctor

      - name: Build site with preview base URL
        env:
          JEKYLL_ENV: production
          PR_NUMBER: ${{ github.event.number }}
        run: |
          bundle exec jekyll build \
            --baseurl "/mta-documentation/pr-previews/${PR_NUMBER}" \
            --destination _site

      - name: Deploy preview to gh-pages
        env:
          PR_NUMBER: ${{ github.event.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Configure git identity for the push
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash the build output before switching branches
          mkdir -p /tmp/pr-preview
          cp -r _site/. /tmp/pr-preview/

          # Fetch or create the gh-pages branch without touching the working tree
          git fetch origin gh-pages 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . --quiet
            echo "GitHub Pages for mta-documentation" > README.md
            git add README.md
            git commit -m "chore: initialise gh-pages branch"
          fi

          # Place the preview under a predictable subdirectory
          PREVIEW_DIR="pr-previews/${PR_NUMBER}"
          rm -rf "${PREVIEW_DIR}"
          mkdir -p "${PREVIEW_DIR}"
          cp -r /tmp/pr-preview/. "${PREVIEW_DIR}/"

          # Commit and push only if there are changes
          git add "${PREVIEW_DIR}"
          if git diff --staged --quiet; then
            echo "No changes to deploy."
          else
            COMMIT_SHA="${{ github.event.pull_request.head.sha }}"
            git commit -m "preview: PR #${PR_NUMBER} @ ${COMMIT_SHA::7}"
            git push origin gh-pages
          fi

      - name: Post or update preview comment
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.number }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = process.env.PR_NUMBER;
            const sha      = context.payload.pull_request.head.sha.substring(0, 7);
            const owner    = context.repo.owner;
            const repo     = context.repo.repo;

            const previewUrl =
              `https://${owner}.github.io/${repo}/pr-previews/${prNumber}/`;

            const body = [
              `## 📄 Documentation Preview`,
              ``,
              `| | |`,
              `|---|---|`,
              `| **Preview URL** | ${previewUrl} |`,
              `| **Commit** | \`${sha}\` |`,
              `| **Updated** | ${new Date().toUTCString()} |`,
              ``,
              `> Preview updates automatically on every push to this PR.`,
              `> It will be removed when the PR is closed.`,
            ].join('\n');

            const marker = '<!-- pr-preview-bot -->';
            const markedBody = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: prNumber,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo,
                comment_id: existing.id,
                body: markedBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: prNumber,
                body: markedBody,
              });
            }
